; PlatformIO project for the ESP32 reflex brain.
; Confirm board + monitor_speed at Day 0. Mirror pins in src/config.h <-> docs/pinout.md.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; NAVIGATION SLICE: no external libraries needed.
; The JSON-lines codec is hand-rolled in src/serial_link.cpp (fixed char buffers,
; zero dynamic allocation) rather than pulling in ArduinoJson — our messages are
; flat objects with a handful of keys, so a library would cost more than it saves.
;
; lib_deps: none needed - the servo is driven directly by LEDC in payload.cpp


; Not needed yet — nothing on this build uses them. Uncomment together with the
; matching HAS_* flag in src/config.h when the hardware is actually wired:
;   miguelbalboa/MFRC522            ; RC522 RFID       -> HAS_RFID 1
;   milesburton/DallasTemperature   ; DS18B20 cold box -> HAS_TEMP 1
;   paulstoffregen/OneWire
